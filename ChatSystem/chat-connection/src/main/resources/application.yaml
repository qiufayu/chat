logging:
  level:
    com.fayu.connection: debug
spring:
  rabbitmq:
    host: ${chat.mq.host}
    port: ${chat.mq.port}
    username: ${chat.mq.un}
    password: ${chat.mq.ps}
    virtual-host: /chat
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 1
        concurrency: 10
        max-concurrency: 50
        prefetch: 50
    template:
      retry:
        enabled: true
        max-attempts: 3
        initial-interval: 1000ms
        multiplier: 1


  application:
    name: chat-connection
  main:
    web-application-type: none
  cloud:
    loadbalancer:
      eager-load:
        clients:
          - chat-message
    nacos:
      discovery:
        server-addr: ${chat.ns.host}:8848
        namespace: 0209fa6e-f222-4b48-a404-efe4e6b010da
      config:
        enabled: false
        namespace: 0209fa6e-f222-4b48-a404-efe4e6b010da
        server-addr: ${chat.ns.host}:8848
    openfeign:
      okhttp:
        enabled: true
      http2client:
        enabled: false
      httpclient:
        hc5:
          enabled: false

  data:
    redis:
      host: ${chat.rd.host}
      port: ${chat.rd.post}
      database: ${chat.rd.db}
      password: ${chat.rd.pw}
